<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>日常请假信息</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,
    "PingFang SC","Helvetica Neue",Arial,sans-serif;
}

body{
    background:#f5f5f7;
    color:#222;
}

.top{
    background:#fff;
    padding-top:18px;
    position:relative;
    text-align:center;
    border-bottom:1px solid #efefef;
}

.close{
    position:absolute;
    left:18px;
    top:22px;
    font-size:34px;
    color:#333;
    font-weight:300;
}

.more{
    position:absolute;
    right:18px;
    top:18px;
    font-size:32px;
    color:#333;
}

.title{
    font-size:22px;
    font-weight:700;
    color:#111;
    letter-spacing:1px;
}

.domain{
    margin-top:6px;
    margin-bottom:16px;
    color:#888;
    font-size:14px;
}

.section{
    background:#f7f7fb;
    padding:14px 16px;
    display:flex;
    align-items:center;
    font-size:18px;
    font-weight:700;
    color:#222;
}

.blue{
    width:5px;
    height:26px;
    border-radius:5px;
    background:#4b6fff;
    margin-right:10px;
}

.card{
    background:#fff;
}

.row{
    display:flex;
    padding:22px 18px;
    border-bottom:1px solid #f0f0f0;
    font-size:18px;
}

.label{
    width:110px;
    color:#777;
    font-weight:600;
}

.value{
    flex:1;
    color:#111;
    font-weight:500;
    line-height:1.5;
}

.bottom{
    height:320px;
    background:#f5f5f7;
}
</style>
</head>

<body>

<div class="section">
    <div class="blue"></div>
    学生请假信息
</div>

<div class="card">

    <div class="row">
        <div class="label">学号</div>
        <div class="value">250813010227</div>
    </div>

    <div class="row">
        <div class="label">姓名</div>
        <div class="value">姚文静</div>
    </div>

    <div class="row">
        <div class="label">学院</div>
        <div class="value">化工学院</div>
    </div>

    <div class="row">
        <div class="label">专业</div>
        <div class="value">化学工程与工艺【本科】</div>
    </div>

    <div class="row">
        <div class="label">班级</div>
        <div class="value">2025级化学工程与工艺2班【2402010102】</div>
    </div>

    <div class="row">
        <div class="label">请假时间</div>
        <div class="value">2026/06/1 19:00至2026/06/1 21:00</div>
    </div>

    <div class="row">
        <div class="label">请假原因</div>
        <div class="value">病假</div>
    </div>

    <div class="row">
        <div class="label">外出地点</div>
        <div class="value"></div>
    </div>

</div>

<div class="bottom"></div>

</body>
</html>
