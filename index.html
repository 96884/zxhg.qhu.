
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日常请假信息</title>
  <style>
    body {
      margin: 0;
      background: #f5f5f5;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #333;
    }

    .header {
      background: white;
      text-align: center;
      padding: 18px 0 10px;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #eee;
    }

    .sub {
      font-size: 14px;
      color: #777;
      margin-top: 4px;
    }

    .card {
      background: white;
      margin-top: 10px;
      padding: 0 18px;
    }

    .title {
      padding: 16px 0;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid #eee;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 16px;
    }

    .label {
      color: #888;
      width: 90px;
    }

    .value {
      flex: 1;
      text-align: left;
      color: #222;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="header">
    日常请假信息
    <div class="sub">zhxg.qhu.edu.cn</div>
  </div>

  <div class="card">
    <div class="title">学生请假信息</div>

    <div class="row">
      <div class="label">学号</div>
      <div class="value">240201010104</div>
    </div>

    <div class="row">
      <div class="label">姓名</div>
      <div class="value">王明亮</div>
    </div>

    <div class="row">
      <div class="label">学院</div>
      <div class="value">财经学院</div>
    </div>

    <div class="row">
      <div class="label">专业</div>
      <div class="value">经济学【本科】</div>
    </div>

    <div class="row">
      <div class="label">班级</div>
      <div class="value">2024级经济学1班【2402010101】</div>
    </div>

    <div class="row">
      <div class="label">请假时间</div>
      <div class="value">2026/05/27 08:00 至 2026/05/27 12:00</div>
    </div>

    <div class="row">
      <div class="label">请假原因</div>
      <div class="value">病假</div>
    </div>
  </div>
</body>
</html>
